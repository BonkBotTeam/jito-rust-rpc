[package]
name = "jito-sdk-rust"
version = "0.3.2"
authors = ["mdr0id <marshall@jito.wtf>"]
edition = "2021"
rust-version = "1.98.1"

description = "Rust SDK for interacting with Jito RPC services on Solana"
license = "MIT"
repository = "https://github.com/jito-labs/jito-rust-rpc"
homepage = "https://www.jito.wtf/"
keywords = ["solana", "rpc", "jito", "blockchain", "sdk"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full", "macros"] }
anyhow = "1.0"
serde = "1.0.209"
bincode = "1.3.3"
bs58 = "0.4.0"
base64 = "0.21.0"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Individual Solana crates - ONLY for examples
[dev-dependencies]
solana-client = "=4.3.0"
solana-instruction = "3.4.0"
solana-pubkey = "4.2.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.0"
solana-transaction = { version = "=4.3.0", features = ["wincode", "serde"] }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
